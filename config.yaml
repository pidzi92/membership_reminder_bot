name: "Membership Reminder Bot"
version: "1.0.0"
slug: "membership_reminder_bot"
description: "Reads a Google Sheet of members and DMs a Discord reminder when someone's membership payment has expired"
url: "https://github.com/your-github-username/membership_reminder_bot"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
map:
  - share:rw
options:
  discord_bot_token: ""
  discord_guild_id: ""
  google_sheet_id: ""
  google_sheet_range: "Članovi!A:L"
  google_service_account_json_path: "/share/membership_reminder_bot/service-account.json"
  header_row: 1
  name_column: "B"
  discord_handle_column: "D"
  status_column: "E"
  status_active_value: "Aktivan"
  paid_until_column: "H"
  date_format: "DD/MM/YYYY"
  timezone: "Europe/Belgrade"
  check_interval_minutes: 60
  notify_days_before_expiry: 3
  reminder_repeat_days: 3
  expired_message_template: "Ćao {name}! 👋 Tvoja članarina je istekla {date} ({days} dana). Molimo te da je što pre obnoviš."
  pre_expiry_message_template: "Ćao {name}! 👋 Podsetnik: tvoja članarina ističe {date} (za {days} dana)."
  admin_notify_channel_id: ""
  dry_run: false
  log_level: "info"
schema:
  discord_bot_token: "password"
  discord_guild_id: "str"
  google_sheet_id: "str"
  google_sheet_range: "str"
  google_service_account_json_path: "str"
  header_row: "int(1,100)"
  name_column: "str"
  discord_handle_column: "str"
  status_column: "str"
  status_active_value: "str"
  paid_until_column: "str"
  date_format: "list(DD/MM/YYYY|MM/DD/YYYY|YYYY-MM-DD)"
  timezone: "str"
  check_interval_minutes: "int(5,1440)"
  notify_days_before_expiry: "int(0,90)"
  reminder_repeat_days: "int(1,90)"
  expired_message_template: "str"
  pre_expiry_message_template: "str"
  admin_notify_channel_id: "str?"
  dry_run: "bool"
  log_level: "list(debug|info|warning|error)"
